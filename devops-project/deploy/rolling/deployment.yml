apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project
  labels:
    app: devops-project
    version: v1
spec:
  replicas: 1  selector:
    matchLabels:
      app: devops-project
  template:
    metadata:
      labels:
        app: devops-project
        version: v1
      annotations:
    spec:
      containers:
      - name: devops-project
        image: devops-project:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: devops-project-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://devops-project-redis:6379/0"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        - name: logs-volume
          mountPath: /app/logs
      volumes:
      - name: config-volume
        configMap:
          name: devops-project-config
      - name: logs-volume
        emptyDir: {}
      imagePullSecrets:
      - name: registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: devops-project
  labels:
    app: devops-project
  annotations:
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: devops-project